<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel de contratos · {{ cfg.empresa }}</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f4f6f8; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  .caja { background:#fff; border:1px solid #cfd8e0; border-radius:10px; padding:28px 24px; width:100%;
          max-width:380px; box-shadow:0 2px 14px rgba(27,77,122,.08); }
  h1 { color:#1b4d7a; font-size:1.1rem; margin:0 0 4px; }
  p { color:#5a6672; font-size:.86rem; margin:0 0 18px; }
  label { display:block; font-size:.82rem; font-weight:600; color:#5a6672; margin-bottom:5px; }
  input { width:100%; padding:11px; border:1px solid #cfd8e0; border-radius:7px; font-size:.95rem; }
  button { margin-top:16px; width:100%; background:#1b4d7a; color:#fff; border:0; padding:12px;
           border-radius:7px; font-size:.96rem; font-weight:600; cursor:pointer; }
  .error { background:#fdecea; border:1px solid #e6b0aa; color:#922b21; padding:9px 11px;
           border-radius:7px; font-size:.85rem; margin-bottom:14px; }
</style>
</head>
<body>
<div class="caja">
  <h1>Panel de contratos</h1>
  <p>Acceso privado de {{ cfg.empresa }}.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/panel/login">
    <label>Contraseña</label>
    <input type="password" name="clave" autofocus required>
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
